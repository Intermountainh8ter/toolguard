[package]
name = "toolguard"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Tool-use safety audit: measure dangerous-tool call rate under benign vs. prompt-injected inputs with a pre-registered gate."
repository = "https://github.com/Intermountainh8ter/toolguard"
keywords = ["llm", "agent", "safety", "tool-use", "prompt-injection"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "toolguard"
path = "src/main.rs"

[lib]
name = "toolguard"
path = "src/lib.rs"
